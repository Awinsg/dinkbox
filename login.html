<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dink Box | Login</title>

<link rel="stylesheet" href="login.css">

<link rel="stylesheet" href="responsive.css">

</head>

<body>

<header>

<a href="index.html" class="logo">DINK BOX</a>

<nav>

    <a href="courts.html">Courts</a>

    <a href="schedule.html">Schedule</a>

    <a href="track.html">View Booking</a>

    <a href="about.html">About</a>

    <a href="login.html">Login</a>

</nav>

</header>

<div class="login-container">

<h1>LOGIN</h1>

<form onsubmit="login(event)" novalidate>

<label for="email">
Email
</label>

<input
    type="email"
    id="email"
    placeholder="Enter your email"
    autocomplete="email"
    required
>

<label for="password">
Password
</label>

<input
    type="password"
    id="password"
    placeholder="Enter your password"
    autocomplete="current-password"
    required
>

<p class="form-error" id="loginError" role="alert"></p>

<button
    type="submit"
    class="login-button"
>
LOGIN
</button>

</form>

<div class="signup">

<p>

Don't have an account?

<a href="signup.html">
Create an account
</a>

</p>

</div>

</div>

<footer>

<p>© 2026 Dink Box. All rights reserved.</p>

</footer>

<script src="bookings.js"></script>
<script src="auth.js"></script>

<script>

if (getCurrentUser()) {
    window.location.href = "index.html";
}

async function login(event) {

    event.preventDefault();

    let email = document.getElementById("email");
    let password = document.getElementById("password");
    let error = document.getElementById("loginError");

    error.textContent = "";

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) {
        error.textContent = "Enter a valid email address.";
        email.focus();
        return;
    }

    if (password.value === "") {
        error.textContent = "Enter your password.";
        password.focus();
        return;
    }

    let result = await loginUser(email.value, password.value);

    if (!result.ok) {
        error.textContent = result.message;
        return;
    }

    window.location.href = "index.html";
}

</script>

<script src="reset-timer.js"></script>

</body>

</html>
